controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - shoulder_joint
      - arm_1_joint
      - arm_2_joint
      - wrist_1_joint
      - wrist_2_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - geared_r_joint
      - geared_l_joint
      - finger_r_joint
      - finger_l_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0